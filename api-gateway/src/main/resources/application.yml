server:
  port: 8080
# 8080 api 
# 8082 pagos
# 8083 clases 
# 8084 evaluaciones
# 8085 inscripciones
# 8086 usuarios
# 8087 auth
# 8088 certificados
# 8089 calificaciones
spring:
  main:
    web-application-type: reactive

  security:
    user:
      name: disabled
      password: disabled

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: swagger-ui
              uri: https://localhost:8080
              predicates:
                - Path=/swagger-ui/** 


            - id: calificaciones-service
              uri: http://calificaciones-service:8089
              predicates:
                - Path=/api/calificaciones/**, /v3/api-docs/calificaciones
              filters:
                - RewritePath=/v3/api-docs/calificaciones, /v3/api-docs

            - id: certificado-service
              uri: http://certificado-service:8088
              predicates:
                - Path=/api/certificados/**, /v3/api-docs/certificados
              filters:
                - RewritePath=/v3/api-docs/certificados, /v3/api-docs

            - id: auth-service
              uri: http://auth-service:8087
              predicates:
                - Path=/api/auth/**, /v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth, /v3/api-docs

            - id: user-service
              uri: http://user-service:8086
              predicates:
                - Path=/api/usuarios/**, /api/roles/**, /v3/api-docs/usuarios
              filters: 
              - RewritePath=/v3/api-docs/usuarios, /v3/api-docs

            - id: pago-service
              uri: http://pago-service:8082
              predicates:
                - Path=/api/pagos/**, /api/transacciones/**, /v3/api-docs/pagos
              filters:
                - RewritePath=/v3/api-docs/pagos, /v3/api-docs

            - id: clases-service
              uri: http://clases-service:8083
              predicates:
                - Path=/api/cursos/**, /api/categorias/**, /api/clases/**, /v3/api-docs/clases
              filters:
                - RewritePath=/v3/api-docs/clases, /v3/api-docs

            - id: evaluaciones-service
              uri: http://evaluaciones-service:8084
              predicates:
                - Path=/api/examenes/**, /api/preguntas/**, /api/alternativas/**, /v3/api-docs/evaluaciones
              filters:
                - RewritePath=/v3/api-docs/evaluaciones, /v3/api-docs


            - id: inscripciones-service
              uri: http://inscripciones-service:8085
              predicates:
                - Path=/api/inscripciones/**, /api/cupos/**/v3/api-docs/inscripciones
              filters:
                - RewritePath=/v3/api-docs/inscripciones, /v3/api-docs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
  swagger-ui.urls[0].name: 1. Autenticación (Auth)
  swagger-ui.urls[0].url: /v3/api-docs/auth
  swagger-ui.urls[1].name: 2. Calificaciones
  swagger-ui.urls[1].url: /v3/api-docs/calificaciones
  swagger-ui.urls[2].name: 3. Certificados
  swagger-ui.urls[2].url: /v3/api-docs/certificados
  swagger-ui.urls[3].name: 4. Usuarios
  swagger-ui.urls[3].url: /v3/api-docs/usuarios
  swagger-ui.urls[4].name: 5. Pagos
  swagger-ui.urls[4].url: /v3/api-docs/pagos
  swagger-ui.urls[5].name: 6. Clases y Cursos
  swagger-ui.urls[5].url: /v3/api-docs/clases
  swagger-ui.urls[6].name: 7. Evaluaciones
  swagger-ui.urls[6].url: /v3/api-docs/evaluaciones
  swagger-ui.urls[7].name: 8. Inscripciones
  swagger-ui.urls[7].url: /v3/api-docs/inscripciones


