server:
  port: 8080
# 8080 api 
# 8082 pagos
# 8083 clases 
# 8084 evaluaciones
# 8085 inscripciones
# 8086 usuarios
# 8087 auth
# 8088 certificados
# 8089 calificaciones
spring:
  main:
    web-application-type: reactive


  cloud:
    gateway:
      server:
        webflux:
          routes:

            # - id: swagger-ui
            #   uri: https://localhost:8080
            #   predicates:
            #     - Path=/swagger-ui/** 


            - id: calificaciones-service
              uri: http://calificaciones-service:8089
              predicates:
                - Path=/api/calificaciones/**

            - id: certificado-service
              uri: http://certificado-service:8088
              predicates:
                - Path=/api/certificados/**

            - id: auth-service
              uri: http://auth-service:8087
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: http://user-service:8086
              predicates:
                - Path=/api/usuarios/**, /api/roles/**

            - id: pago-service
              uri: http://pago-service:8082
              predicates:
                - Path=/api/pagos/**, /api/transacciones/**

            - id: clases-service
              uri: http://clases-service:8083
              predicates:
                - Path=/api/cursos/**, /api/categorias/**, /api/clases/**

            - id: evaluaciones-service
              uri: http://evaluaciones-service:8084
              predicates:
                - Path=/api/examenes/**, /api/preguntas/**, /api/alternativas/**

            - id: inscripciones-service
              uri: http://inscripciones-service:8085
              predicates:
                - Path=/api/inscripciones/**, /api/cupos/**

jwt:
  secret: esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer