server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/user/**

            - id: pago-service
              uri: http://localhost:8082
              predicates:
                - Path=/pago/**

            - id: clases-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/cursos/**, /api/categorias/**, /api/clases/**
                            
            - id: evaluaciones-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/examenes/**, /api/preguntas/**, /api/alternativas/**
            
            - id: inscripciones-service
              uri: http://localhost:8085
              predicates:
                - Path=/inscripciones/**