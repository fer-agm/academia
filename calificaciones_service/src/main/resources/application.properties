spring.application.name=calificaciones_service
server.port=8089

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.liquibase.enabled=false
SECRET=esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Hide auto-exposed Spring Data REST repository endpoints (use the /api controllers instead)
spring.data.rest.detection-strategy=annotated

# Cross-service existence checks (via api-gateway)
api.curso.exists=http://api-gateway:8080/api/cursos/%d/existe
api.evaluacion.exists=http://api-gateway:8080/api/evaluaciones/%d/existe
api.usuario.exists=http://api-gateway:8080/api/usuarios/run/%s/existe