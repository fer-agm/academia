spring.application.name=auth_service
server.port=8087

spring.datasource.url=jdbc:mysql://mysql:3306/academia_noafer
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# auth-service solo LEE la tabla 'usuarios' (la administra user-service); no crea ni siembra tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.liquibase.enabled=false

jwt.secret=esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer
jwt.expiration=3600000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true