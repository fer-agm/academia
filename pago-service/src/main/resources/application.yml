spring:
  application:
    name: pago-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  liquibase:
    enabled: false
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      # iva/totalPagar se calculan en el servidor (READ_ONLY en el DTO); permitir que falten en el POST
      fail-on-null-for-primitives: false
  data:
    rest:
      detection-strategy: annotated

server:
  port: 8082

# Validaciones de existencia vía api-gateway
api:
  curso:
    exists: "http://api-gateway:8080/api/cursos/%d/existe"
  usuario:
    exists: "http://api-gateway:8080/api/usuarios/run/%s/existe"

SECRET: esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
