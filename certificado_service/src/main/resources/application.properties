spring.application.name=certificado-service
server.port=8088

# Datasource is provided by the environment (see docker-compose.yml -> shared academia_noafer DB)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

api.curso.exists=http://clases-service:8083/api/clases/%d/existe

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.liquibase.enabled=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT validation secret (overridden by the SECRET env var in Docker)
SECRET=esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
