spring.application.name=inscripciones-service
server.port=8085

# Datasource is provided by the environment (see docker-compose.yml -> shared academia_noafer DB)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.liquibase.enabled=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Inter-service call to clases-service (Docker service name + port)
clases.service.url=http://clases-service:8083

# Existence checks through the API gateway (require JWT forwarding)
api.curso.exists=http://api-gateway:8080/api/cursos/%d/existe
api.usuario.exists=http://api-gateway:8080/api/usuarios/run/%s/existe

# JWT validation secret (overridden by the SECRET env var in Docker)
SECRET=esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Hide auto-exposed Spring Data REST repository endpoints (use the /api controllers instead)
spring.data.rest.detection-strategy=annotated
