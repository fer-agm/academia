spring.application.name=user-service
server.port=8086

# Datasource is provided by the environment (see docker-compose.yml -> shared academia_noafer DB)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.liquibase.enabled=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT validation secret (overridden by the SECRET env var in Docker)
SECRET=esta_es_mi_compleja_clave_secreta_para_jwt_2026_academia_noafer

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Hide auto-exposed Spring Data REST repository endpoints (use the /api controllers instead)
spring.data.rest.detection-strategy=annotated

# auth-service base URL (auto-provision login credentials when a user is created)
auth.service.url=http://auth-service:8087
